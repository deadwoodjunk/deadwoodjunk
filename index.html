<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaAI 用語辞典</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-dark:  #0a3d6b;
      --blue-main:  #1565c0;
      --blue-light: #1e88e5;
      --blue-pale:  #e3f2fd;
      --blue-bg:    #f0f7ff;
      --white:      #ffffff;
      --gray-100:   #f5f7fa;
      --gray-300:   #cfd8dc;
      --gray-600:   #546e7a;
      --gray-800:   #263238;
      --accent:     #00acc1;
      --accent-light: #e0f7fa;
      --shadow-sm:  0 2px 8px rgba(21,101,192,.12);
      --shadow-md:  0 6px 24px rgba(21,101,192,.16);
      --radius:     12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: var(--blue-bg);
      color: var(--gray-800);
      min-height: 100vh;
    }

    /* ===== Header ===== */
    header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-main) 60%, var(--blue-light) 100%);
      color: var(--white);
      padding: 0 24px;
      box-shadow: 0 2px 12px rgba(10,61,107,.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 60px;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,.18);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .header-sub {
      font-size: .7rem;
      opacity: .8;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* ===== Hero / Search ===== */
    .hero {
      background: linear-gradient(160deg, var(--blue-dark) 0%, var(--blue-main) 55%, var(--accent) 100%);
      padding: 56px 24px 64px;
      text-align: center;
      color: var(--white);
    }
    .hero-eyebrow {
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      opacity: .75;
      margin-bottom: 10px;
    }
    .hero-heading {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .hero-desc {
      font-size: .9rem;
      opacity: .8;
      margin-bottom: 32px;
    }

    /* Search box */
    .search-wrap {
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 18px 56px 18px 52px;
      font-size: 1rem;
      border: none;
      border-radius: 50px;
      outline: none;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      color: var(--gray-800);
      background: var(--white);
      transition: box-shadow .2s;
    }
    .search-input:focus {
      box-shadow: 0 4px 28px rgba(0,172,193,.5);
    }
    .search-input::placeholder { color: var(--gray-300); }
    .search-icon {
      position: absolute;
      left: 18px; top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--blue-main);
      pointer-events: none;
    }
    .clear-btn {
      position: absolute;
      right: 16px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: var(--gray-300);
      display: none;
      padding: 4px;
      line-height: 1;
    }
    .clear-btn:hover { color: var(--gray-600); }

    /* Stats bar */
    .stats-bar {
      max-width: 640px;
      margin: 14px auto 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: .78rem;
      opacity: .75;
    }
    .stats-bar span { display: flex; align-items: center; gap: 5px; }

    /* ===== Main content ===== */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 16px 60px;
    }

    /* Category filter */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px solid var(--gray-300);
      background: var(--white);
      color: var(--gray-600);
      font-size: .82rem;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s;
    }
    .filter-btn:hover { border-color: var(--blue-light); color: var(--blue-main); }
    .filter-btn.active {
      background: var(--blue-main);
      border-color: var(--blue-main);
      color: var(--white);
    }

    /* Section label */
    .section-label {
      font-size: .82rem;
      font-weight: 700;
      color: var(--blue-main);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-300);
    }

    /* Result count */
    .result-count {
      font-size: .85rem;
      color: var(--gray-600);
      margin-bottom: 20px;
    }
    .result-count strong { color: var(--blue-main); }

    /* ===== Cards grid ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }
    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow .25s, transform .25s;
      border: 1px solid rgba(21,101,192,.08);
    }
    .card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }

    .card-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--blue-pale);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .card-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      background: var(--blue-pale);
    }
    .card-title-wrap { flex: 1; min-width: 0; }
    .card-term {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--blue-dark);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-category {
      display: inline-block;
      font-size: .7rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: .05em;
    }

    .card-body { padding: 16px 20px; }

    .card-section-title {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-section-title.meaning { color: var(--blue-main); }
    .card-section-title.talk    { color: var(--accent); }

    .card-meaning {
      font-size: .88rem;
      line-height: 1.75;
      color: var(--gray-800);
      margin-bottom: 14px;
    }

    .talk-box {
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      font-size: .85rem;
      line-height: 1.75;
      color: var(--gray-800);
      position: relative;
    }
    .talk-box::before {
      content: '💬';
      position: absolute;
      top: 10px; right: 12px;
      font-size: .9rem;
      opacity: .5;
    }

    /* ===== No result ===== */
    .no-result {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-600);
      display: none;
    }
    .no-result .icon { font-size: 3rem; margin-bottom: 14px; }
    .no-result h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--gray-800); }
    .no-result p  { font-size: .88rem; }

    /* ===== Highlight ===== */
    mark {
      background: #fff176;
      border-radius: 3px;
      padding: 0 2px;
      color: inherit;
    }

    /* ===== Category badge colors ===== */
    .cat-ai        { background: #e8eaf6; color: #3949ab; }
    .cat-drug      { background: #e8f5e9; color: #2e7d32; }
    .cat-clinical  { background: #fff3e0; color: #e65100; }
    .cat-molecule  { background: #fce4ec; color: #c62828; }
    .cat-regulatory{ background: #f3e5f5; color: #6a1b9a; }

    .cat-ai-icon        { background: #e8eaf6; }
    .cat-drug-icon      { background: #e8f5e9; }
    .cat-clinical-icon  { background: #fff3e0; }
    .cat-molecule-icon  { background: #fce4ec; }
    .cat-regulatory-icon{ background: #f3e5f5; }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 28px 16px;
      font-size: .78rem;
      color: var(--gray-600);
      border-top: 1px solid var(--gray-300);
      background: var(--white);
    }
  </style>
</head>
<body>

<!-- Header -->
<header>

</header>

<!-- Hero / Search -->

</section>

<!-- Main -->
<main>

  <div id="resultCount" class="result-count"></div>
  <div class="section-label" id="sectionLabel">用語一覧</div>

  <div class="cards-grid" id="cardsGrid"></div>

  <div class="no-result" id="noResult">
    <div class="icon">🔍</div>

    <p>別のキーワードで検索してみてください</p>
  </div>
</main>

<footer>
  © 2025 PharmaAI 用語辞典 &nbsp;|&nbsp; 製薬 × AI 営業支援ツール
</footer>

// ==============================
//  Render helpers
// ==============================
const catClass = {
  "AI技術":   "ai",
  "創薬":     "drug",
  "臨床試験": "clinical",
  "分子・生物":"molecule",
  "規制・薬事":"regulatory"
};

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
}

function renderCard(item, query) {
  const cc = catClass[item.category] || "ai";
  return `
  <div class="card">
    <div class="card-header">
      <div class="card-icon cat-${cc}-icon">${item.icon}</div>
      <div class="card-title-wrap">
        <div class="card-term">${highlight(item.term, query)}</div>
        <span class="card-category cat-${cc}">${item.category}</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-section-title meaning">📖 意味・解説</div>
      <p class="card-meaning">${highlight(item.meaning, query)}</p>
      <div class="card-section-title talk">🗣 営業トーク例</div>
      <div class="talk-box">${highlight(item.talk, query)}</div>
    </div>
  </div>`;
}

// ==============================
//  State & DOM refs
// ==============================
let currentQuery = "";
let currentCat   = "all";

const input       = document.getElementById('searchInput');
const clearBtn    = document.getElementById('clearBtn');
const grid        = document.getElementById('cardsGrid');
const noResult    = document.getElementById('noResult');
const noResultTerm= document.getElementById('noResultTerm');
const resultCount = document.getElementById('resultCount');
const sectionLabel= document.getElementById('sectionLabel');
const totalCount  = document.getElementById('totalCount');
const filterBar   = document.getElementById('filterBar');

// ==============================
//  Render
// ==============================
function render() {
  const q   = currentQuery.trim().toLowerCase();
  const cat = currentCat;

  const filtered = terms.filter(item => {
    const matchCat = cat === 'all' || item.category === cat;
    const matchQ   = !q ||
      item.term.toLowerCase().includes(q) ||
      (item.abbr && item.abbr.toLowerCase().includes(q)) ||
      item.meaning.toLowerCase().includes(q) ||
      item.talk.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResult.style.display = 'block';
    noResultTerm.textContent = currentQuery || '（条件）';
    resultCount.textContent = '';
    sectionLabel.textContent = '検索結果';
  } else {
    noResult.style.display = 'none';
    grid.innerHTML = filtered.map(item => renderCard(item, currentQuery.trim())).join('');
    sectionLabel.textContent = q ? '検索結果' : (cat === 'all' ? '用語一覧' : cat + ' の用語');
    resultCount.innerHTML = q
      ? `<strong>${filtered.length}</strong> 件ヒット（全 ${terms.length} 件中）`
      : `全 <strong>${filtered.length}</strong> 件`;
  }
}

// ==============================
//  Events
// ==============================
input.addEventListener('input', () => {
  currentQuery = input.value;
  clearBtn.style.display = currentQuery ? 'block' : 'none';
  render();
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  currentQuery = '';
  clearBtn.style.display = 'none';
  input.focus();
  render();
});

filterBar.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  render();
});

// ==============================
//  Init
// ==============================
totalCount.textContent = terms.length;
render();
</script>
