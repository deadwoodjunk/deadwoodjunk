<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaAI 用語辞典 | 製薬×AI 専門用語検索</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-900: #0d2d5e;
      --blue-700: #1a4f9c;
      --blue-500: #2563eb;
      --blue-400: #3b82f6;
      --blue-100: #dbeafe;
      --blue-50:  #eff6ff;
      --teal-500: #0d9488;
      --teal-100: #ccfbf1;
      --white:    #ffffff;
      --gray-50:  #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 16px rgba(37,99,235,.10), 0 2px 6px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 40px rgba(37,99,235,.15), 0 4px 12px rgba(0,0,0,.08);
      --radius: 16px;
      --radius-sm: 10px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', 'Yu Gothic', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      line-height: 1.7;
    }

    /* ===== Header ===== */
    header {
      background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-700) 60%, var(--blue-500) 100%);
      padding: 48px 20px 72px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 40px;
      background: var(--gray-50);
      clip-path: ellipse(55% 100% at 50% 100%);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      color: #bfdbfe;
      letter-spacing: .06em;
      margin-bottom: 20px;
    }
    .header-badge .dot {
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .6; transform: scale(1.3); }
    }

    header h1 {
      font-size: clamp(22px, 5vw, 38px);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -.01em;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    header h1 span { color: #93c5fd; }

    header p {
      font-size: clamp(13px, 2.5vw, 16px);
      color: #bfdbfe;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ===== Search Box ===== */
    .search-wrapper {
      max-width: 680px;
      margin: -32px auto 0;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .search-box {
      position: relative;
      background: var(--white);
      border-radius: 100px;
      box-shadow: var(--shadow-lg);
      border: 2px solid transparent;
      transition: border-color .25s, box-shadow .25s;
    }
    .search-box:focus-within {
      border-color: var(--blue-400);
      box-shadow: 0 0 0 4px rgba(59,130,246,.15), var(--shadow-lg);
    }

    .search-icon {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--blue-500);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      padding: 18px 130px 18px 58px;
      font-size: clamp(15px, 2.5vw, 17px);
      border: none;
      outline: none;
      background: transparent;
      color: var(--gray-800);
      border-radius: 100px;
      font-family: inherit;
    }
    #searchInput::placeholder { color: var(--gray-400); }

    .clear-btn {
      position: absolute;
      right: 110px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-400);
      padding: 4px;
      border-radius: 50%;
      display: none;
      transition: color .2s, background .2s;
      line-height: 1;
    }
    .clear-btn:hover { color: var(--gray-600); background: var(--gray-100); }
    .clear-btn.visible { display: flex; align-items: center; justify-content: center; }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, var(--blue-500), var(--blue-700));
      color: var(--white);
      border: none;
      border-radius: 100px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .search-btn:hover { opacity: .9; transform: translateY(-50%) scale(1.02); }
    .search-btn:active { transform: translateY(-50%) scale(.98); }

    /* ===== Category Tabs ===== */
    .tabs-wrapper {
      max-width: 920px;
      margin: 36px auto 0;
      padding: 0 20px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tab {
      padding: 8px 18px;
      border-radius: 100px;
      border: 1.5px solid var(--gray-200);
      background: var(--white);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-600);
      transition: all .2s;
      font-family: inherit;
    }
    .tab:hover { border-color: var(--blue-400); color: var(--blue-500); background: var(--blue-50); }
    .tab.active {
      background: var(--blue-500);
      border-color: var(--blue-500);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(37,99,235,.3);
    }

    /* ===== Stats Bar ===== */
    .stats-bar {
      max-width: 920px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .result-count {
      font-size: 13px;
      color: var(--gray-600);
    }
    .result-count strong { color: var(--blue-500); font-size: 16px; }
    .sort-select {
      font-size: 13px;
      padding: 6px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      background: var(--white);
      color: var(--gray-600);
      cursor: pointer;
      font-family: inherit;
      outline: none;
    }
    .sort-select:focus { border-color: var(--blue-400); }

    /* ===== Cards Grid ===== */
    .cards-grid {
      max-width: 920px;
      margin: 20px auto 0;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
      gap: 20px;
    }

    /* ===== Card ===== */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1.5px solid var(--gray-100);
      overflow: hidden;
      transition: transform .25s, box-shadow .25s, border-color .25s;
      animation: fadeInUp .35s ease both;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--blue-100);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:nth-child(2) { animation-delay: .05s; }
    .card:nth-child(3) { animation-delay: .10s; }
    .card:nth-child(4) { animation-delay: .15s; }
    .card:nth-child(5) { animation-delay: .20s; }
    .card:nth-child(6) { animation-delay: .25s; }

    .card-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title-wrap {}
    .card-term {
      font-size: clamp(17px, 3vw, 20px);
      font-weight: 800;
      color: var(--blue-700);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .card-en {
      font-size: 12px;
      color: var(--gray-400);
      font-style: italic;
    }

    .card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      padding: 3px 9px;
      border-radius: 100px;
    }
    .tag-ai     { background: #ede9fe; color: #6d28d9; }
    .tag-pharma { background: var(--teal-100); color: var(--teal-500); }
    .tag-trial  { background: #fef3c7; color: #d97706; }
    .tag-drug   { background: #fee2e2; color: #dc2626; }
    .tag-digital { background: #e0f2fe; color: #0369a1; }

    .card-body { padding: 20px 24px; }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-label.meaning { color: var(--blue-500); }
    .section-label.talk    { color: var(--teal-500); }

    .meaning-text {
      font-size: 14px;
      color: var(--gray-600);
      line-height: 1.75;
      margin-bottom: 20px;
    }

    .talk-bubble {
      background: linear-gradient(135deg, var(--blue-50), #f0fdf4);
      border: 1px solid var(--blue-100);
      border-left: 4px solid var(--blue-400);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 14px;
      color: var(--gray-700);
      line-height: 1.75;
      position: relative;
    }
    .talk-bubble::before {
      content: '"';
      font-size: 36px;
      color: var(--blue-200);
      position: absolute;
      top: 6px; left: 10px;
      line-height: 1;
      font-family: Georgia, serif;
    }
    .talk-bubble p { padding-left: 18px; }

    .card-footer {
      padding: 12px 24px;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .difficulty {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gray-400);
    }
    .difficulty-dots {
      display: flex;
      gap: 3px;
    }
    .difficulty-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gray-200);
    }
    .difficulty-dot.filled { background: var(--blue-400); }

    .copy-btn {
      background: none;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--gray-500);
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }
    .copy-btn:hover {
      background: var(--blue-50);
      border-color: var(--blue-300);
      color: var(--blue-600);
    }
    .copy-btn.copied {
      background: #dcfce7;
      border-color: #86efac;
      color: #16a34a;
    }

    /* ===== Empty State ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      animation: fadeInUp .35s ease;
    }
    .empty-state .emoji { font-size: 64px; margin-bottom: 20px; display: block; }
    .empty-state h3 { font-size: 20px; color: var(--gray-800); margin-bottom: 10px; }
    .empty-state p  { font-size: 14px; color: var(--gray-400); }

    /* ===== Highlight ===== */
    mark {
      background: #fef08a;
      color: var(--gray-800);
      border-radius: 3px;
      padding: 0 2px;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 32px 20px;
      border-top: 1px solid var(--gray-200);
      font-size: 12px;
      color: var(--gray-400);
    }
    footer strong { color: var(--blue-500); }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      header { padding: 36px 16px 64px; }
      .search-box { border-radius: 20px; }
      #searchInput { padding: 14px 100px 14px 48px; border-radius: 20px; }
      .search-btn { padding: 8px 14px; font-size: 13px; border-radius: 14px; }
      .clear-btn { right: 86px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ===== Header ===== -->
<header>
  <div class="header-badge">
    <span class="dot"></span>
    製薬 × AI 専門用語辞典
  </div>
  <h1>PharmaAI <span>用語辞典</span></h1>
  <p>製薬業界・AI技術の専門用語を即座に検索。<br>営業トークにそのまま使えるフレーズ付き。</p>
</header>

<!-- ===== Search ===== -->
<div class="search-wrapper">
  <div class="search-box">
    <svg class="search-icon" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input
      type="text"
      id="searchInput"
      placeholder="用語を検索… 例: AlphaFold, LLM, 治験"
      autocomplete="off"
      spellcheck="false"
    />
    <button class="clear-btn" id="clearBtn" aria-label="クリア">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
    <button class="search-btn" id="searchBtn">検索</button>
  </div>
</div>

<!-- ===== Category Tabs ===== -->
<div class="tabs-wrapper">
  <div class="tabs" id="tabsContainer">
    <button class="tab active" data-category="all">すべて</button>
    <button class="tab" data-category="AI">AI・機械学習</button>
    <button class="tab" data-category="drug">創薬・化学</button>
    <button class="tab" data-category="trial">臨床試験</button>
    <button class="tab" data-category="digital">デジタルヘルス</button>
    <button class="tab" data-category="pharma">製薬業界</button>
  </div>
</div>

<!-- ===== Stats ===== -->
<div class="stats-bar">
  <div class="result-count" id="resultCount"></div>
  <select class="sort-select" id="sortSelect">
    <option value="default">並び順: デフォルト</option>
    <option value="az">用語: A→Z</option>
    <option value="za">用語: Z→A</option>
    <option value="easy">難易度: 易しい順</option>
    <option value="hard">難易度: 難しい順</option>
  </select>
</div>

<!-- ===== Cards Grid ===== -->
<div class="cards-grid" id="cardsGrid"></div>

<!-- ===== Footer ===== -->
<footer>
  <p>© 2025 <strong>PharmaAI 用語辞典</strong> — 製薬×AIビジネスを支援する専門用語データベース</p>
</footer>

<script>

// DATA

const terms = [
  {

    en: "Large Language Model",
    category: "AI",
    tags: ["AI"],
    difficulty: 3,
    meaning: "GPT-4やGeminiなどに代表される、膨大なテキストデータを学習した大規模なAIモデル。自然言語を理解・生成する能力に優れており、文書作成・要約・質問応答など幅広い業務に応用できる。製薬業界では添付文書の解析、副作用報告の自動化、論文サマリー生成などに活用が進んでいる。",

  {

  },
  {

    en: "Small Molecule Drug Discovery",
    category: "drug",

  {

    talk: "SBDDとAIを組み合わせることで、ターゲットへの結合親和性や選択性を予測しながら化合物設計を進められます。御社のプログラムで構造データがあれば、弊社のドッキングシミュレーションAIで候補化合物の優先順位付けを一気に効率化できます。"

// ============================================================
// STATE
// ============================================================
let currentQuery    = '';
let currentCategory = 'all';
let currentSort     = 'default';

// ============================================================
// RENDER
// ============================================================
function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function getDifficultyDots(level) {
  return Array.from({ length: 5 }, (_, i) =>
    `<span class="difficulty-dot${i < level ? ' filled' : ''}"></span>`
  ).join('');
}

function createTag(type) {
  const labels = { AI: 'AI', drug: '創薬', trial: '臨床試験', digital: 'デジタル', pharma: '製薬' };
  const cls    = { AI: 'tag-ai', drug: 'tag-drug', trial: 'tag-trial', digital: 'tag-digital', pharma: 'tag-pharma' };
  return `<span class="tag ${cls[type]}">${labels[type]}</span>`;
}

function renderCard(t, query) {
  const q    = query.trim();
  const term = highlight(t.term, q);
  const mean = highlight(t.meaning, q);
  const talk = highlight(t.talk, q);
  const tags = t.tags.map(createTag).join('');
  const dots = getDifficultyDots(t.difficulty);
  return `
    <div class="card">
      <div class="card-header">
        <div class="card-title-wrap">
          <div class="card-term">${term}</div>
          ${t.en ? `<div class="card-en">${t.en}</div>` : ''}
        </div>
        <div class="card-tags">${tags}</div>
      </div>
      <div class="card-body">
        <div class="section-label meaning">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
          意味・解説
        </div>
        <div class="meaning-text">${mean}</div>
        <div class="section-label talk">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          営業トーク例
        </div>
        <div class="talk-bubble"><p>${talk}</p></div>
      </div>
      <div class="card-footer">
        <div class="difficulty">
          <span>難易度</span>
          <div class="difficulty-dots">${dots}</div>
        </div>
        <button class="copy-btn" onclick="copyTalk(this, \`${t.talk.replace(/`/g, '\\`')}\`)">
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          トークをコピー
        </button>
      </div>
    </div>`;
}

function filterAndSort() {
  let result = [...terms];

  // Filter by category
  if (currentCategory !== 'all') {
    result = result.filter(t => t.tags.includes(currentCategory));
  }

  // Filter by query
  const q = currentQuery.toLowerCase().trim();
  if (q) {
    result = result.filter(t =>
      t.term.toLowerCase().includes(q) ||
      (t.en && t.en.toLowerCase().includes(q)) ||
      t.meaning.toLowerCase().includes(q) ||
      t.talk.toLowerCase().includes(q)
    );
  }

  // Sort
  if (currentSort === 'az')   result.sort((a, b) => a.term.localeCompare(b.term, 'ja'));
  if (currentSort === 'za')   result.sort((a, b) => b.term.localeCompare(a.term, 'ja'));
  if (currentSort === 'easy') result.sort((a, b) => a.difficulty - b.difficulty);
  if (currentSort === 'hard') result.sort((a, b) => b.difficulty - a.difficulty);

  return result;
}

function render() {
  const grid    = document.getElementById('cardsGrid');
  const counter = document.getElementById('resultCount');
  const result  = filterAndSort();

  counter.innerHTML = currentQuery || currentCategory !== 'all'
    ? `<strong>${result.length}</strong> 件 見つかりました`
    : `全 <strong>${result.length}</strong> 件`;

  if (result.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="emoji">🔍</span>
        <h3>「${currentQuery}」に一致する用語が見つかりません</h3>
        <p>別のキーワードでお試しください。または<a href="#" onclick="resetSearch(event)" style="color:var(--blue-500)">すべての用語を表示</a></p>
      </div>`;
    return;
  }

  grid.innerHTML = result.map(t => renderCard(t, currentQuery)).join('');
}

// ============================================================
// INTERACTIONS
// ============================================================
function resetSearch(e) {
  if (e) e.preventDefault();
  document.getElementById('searchInput').value = '';
  currentQuery = '';
  document.getElementById('clearBtn').classList.remove('visible');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-category="all"]').classList.add('active');
  currentCategory = 'all';
  render();
}

function copyTalk(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ コピーしました';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> トークをコピー`;
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ===== Event Listeners =====
const searchInput = document.getElementById('searchInput');
const clearBtn    = document.getElementById('clearBtn');
const searchBtn   = document.getElementById('searchBtn');

searchInput.addEventListener('input', () => {
  const val = searchInput.value;
  clearBtn.classList.toggle('visible', val.length > 0);
  currentQuery = val;
  render();
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') render();
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  currentQuery = '';
  clearBtn.classList.remove('visible');
  render();
});

searchBtn.addEventListener('click', () => {
  currentQuery = searchInput.value;
  render();
});

document.getElementById('tabsContainer').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentCategory = tab.dataset.category;
  render();
});

document.getElementById('sortSelect').addEventListener('change', e => {
  currentSort = e.target.value;
  render();
});

// ===== Initial Render =====
render();
</script>
